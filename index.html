<html>
<head>
<title> Even Odd App </title>
<style>
*{
font-size: 40px;
text-align:center;
}
body {
background-color: azure;
}
</style>
</head>
<body>
<h1> Even Odd App </h1>
<form onsubmit="check(event)">
<input type="number"
id="num"
placeholder="Enter Integer"
/>
<br/><br/>
<input type="submit"
value = "Check Even / Odd"
/>
</form>
<h2 id="msg"></h2>
<script>
function check(event)
{
event.preventDefault();
let num = document.getElementById("num");
let msg = document.getElementById("msg");
if (num.value ==="")
{
alert("please enter integer");
msg.textContent ="";
num.focus();
return;
}

let n = parseInt(num.value);
let url = "https://evenodd-1tbk.onrender.com/check/" + n;
fetch(url)
.then(res => res.text())
.then(data => {
msg.textContent = data;
})
.catch(err => {
console.log(err);
msg.textContent = "issue " + err;
});
}
</script>
</body>
</html>
